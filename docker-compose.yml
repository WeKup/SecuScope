version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://secuuser:secupass@db:5432/secudb
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - .:/app

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: secuuser
      POSTGRES_PASSWORD: secupass
      POSTGRES_DB: secudb
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: